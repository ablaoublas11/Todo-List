<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="todoHead">
      <nav class="navBar">
        <div class="logo">
          <img
            src="./assets/logo/dark-logo.png"
            alt="Taskly | Focus - Plan - Done"
          />
          <h2>Focus - Plan - Done</h2>
        </div>
        <div class="search">
          <input
            class="search-input"
            type="text"
            placeholder="Search for tasks or projects......"
          />
        </div>
        <div class="toogle-theme">
          <button class="toogle-theme-btn">
            <svg
              class="icon-sun"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4.5" />
              <line x1="12" y1="1.5" x2="12" y2="4" />
              <line x1="12" y1="20" x2="12" y2="22.5" />
              <line x1="1.5" y1="12" x2="4" y2="12" />
              <line x1="20" y1="12" x2="22.5" y2="12" />
              <line x1="4.2" y1="4.2" x2="6" y2="6" />
              <line x1="18" y1="18" x2="19.8" y2="19.8" />
              <line x1="4.2" y1="19.8" x2="6" y2="18" />
              <line x1="18" y1="6" x2="19.8" y2="4.2" />
            </svg>
          </button>
        </div>
        <div class="accountDetails">
          <svg
            class="icon-account"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8.5" r="3.5" />
            <path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" />
          </svg>
        </div>
      </nav>
    </header>
    <main class="main-content">
      <section class="left-menu">
        <div class="new-todo">+ New Task</div>
        <div class="new-project">+ New Project</div>
        <div class="filters"></div>
      </section>
      <section class="main-container">
        <div class="todos-container"></div>
        <div class="projects-container"></div>
      </section>
    </main>
  </body>
</html>
