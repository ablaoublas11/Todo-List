<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="todoHead">
      <nav class="navBar">
        <div class="logo">
          <img
            src="./assets/logo/dark-logo.png"
            alt="Taskly | Focus - Plan - Done"
          />
          <h2>Focus - Plan - Done</h2>
        </div>
        <div class="search">
          <input
            class="search-input"
            type="text"
            placeholder="Search for tasks or projects......"
          />
        </div>
        <div class="toogle-theme">
          <button class="toogle-theme-btn">
            <svg
              class="icon-sun"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4.5" />
              <line x1="12" y1="1.5" x2="12" y2="4" />
              <line x1="12" y1="20" x2="12" y2="22.5" />
              <line x1="1.5" y1="12" x2="4" y2="12" />
              <line x1="20" y1="12" x2="22.5" y2="12" />
              <line x1="4.2" y1="4.2" x2="6" y2="6" />
              <line x1="18" y1="18" x2="19.8" y2="19.8" />
              <line x1="4.2" y1="19.8" x2="6" y2="18" />
              <line x1="18" y1="6" x2="19.8" y2="4.2" />
            </svg>
          </button>
        </div>
        <div class="accountDetails">
          <svg
            class="icon-account"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="8.5" r="3.5" />
            <path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" />
          </svg>
        </div>
      </nav>
    </header>
    <main class="main-content">
      <section class="left-menu">
        <div class="new-todo">
          <button class="new-task" data-action="new-task">+ New Task</button>
        </div>
        <div class="new-project">
          <button class="new-project-btn" data-action="new-project">
            + New Project
          </button>
        </div>
        <div class="filters"></div>
      </section>
      <section class="main-container">
        <ul class="todos-container"></ul>
        <ul class="projects-container"></ul>
        <div class="details-container"></div>
      </section>
      <!-- Φόρμα για την εισαγωγή δεδομένων για κάθε Task -->
      <section class="form-container">
        <h2>Νέα Εργασία</h2>

        <form id="todo-form" action="#" method="post">
          <!-- Τίτλος -->
          <div class="form-group">
            <label for="title" class="required">Τίτλος</label>
            <input
              type="text"
              id="title"
              name="title"
              placeholder="π.χ. Ολοκλήρωση αναφοράς"
              required
              autocomplete="off"
            />
          </div>

          <!-- Περιγραφή -->
          <div class="form-group">
            <label for="description">Περιγραφή</label>
            <textarea
              id="description"
              name="description"
              placeholder="Σύντομη περιγραφή της εργασίας..."
              rows="3"
            ></textarea>
          </div>

          <!-- Σημειώσεις -->
          <div class="form-group">
            <label for="notes">Σημειώσεις</label>
            <textarea
              id="notes"
              name="notes"
              placeholder="Επιπλέον σημειώσεις, links, υπενθυμίσεις..."
              rows="3"
            ></textarea>
          </div>

          <!-- Ημερομηνία λήξης -->
          <div class="form-group">
            <label for="due-date">Ημερομηνία λήξης</label>
            <input type="date" id="due-date" name="due_date" />
          </div>

          <!-- Προτεραιότητα -->
          <div class="form-group">
            <label for="priority">Προτεραιότητα</label>
            <select id="priority" name="priority">
              <option value="low">Χαμηλή</option>
              <option value="medium" selected>Μεσαία</option>
              <option value="high">Υψηλή</option>
            </select>
          </div>

          <button
            type="submit"
            class="btn-submit"
            data-action="btn-submit-task"
          >
            Αποθήκευση Εργασίας
          </button>
        </form>
      </section>
      <!-- ---------------------------------------------- -->
      <!-- Φόρμα για την δημιουργία ενός νέου Project  -->

      <section class="form-project-container">
        <h1>Νέο Project</h1>

        <form id="project-form" action="#" method="post">
          <!-- Όνομα Project -->
          <div class="form-group">
            <label for="project-name" class="required">Όνομα Project</label>
            <input
              type="text"
              id="project-name"
              name="name"
              placeholder="π.χ. Ανακαίνιση Ιστοσελίδας"
              required
              autocomplete="off"
            />
          </div>

          <!-- Περιγραφή -->
          <div class="form-group">
            <label for="project-description">Περιγραφή</label>
            <textarea
              id="project-description"
              name="description"
              placeholder="Σύντομη περιγραφή του project..."
              rows="3"
            ></textarea>
          </div>

          <!-- Επιλογή Tasks -->
          <div class="form-group">
            <label>Επιλογή Tasks</label>
            <p
              style="font-size: 0.85rem; color: #6b7280; margin-bottom: 0.5rem"
            >
              Επίλεξε τα tasks που θέλεις να ανήκουν σε αυτό το project
            </p>

            <div class="tasks-list" id="tasks-list">
              <!-- Τα tasks φορτώνονται εδώ δυναμικά -->
            </div>

            <div class="selected-count" id="selected-count">
              Επιλεγμένα: 0 tasks
            </div>
          </div>

          <button
            type="submit"
            class="btn-submit"
            data-action="btn-submit-project"
          >
            Δημιουργία Project
          </button>
        </form>
      </section>

      <!-- -------------------------------------------- -->
      <!-- Template με βάση του οποίο θα δημιουργούντε όλα τα Task στο UI -->
      <template id="task-template">
        <li class="task-card">
          <input type="checkbox" class="task-check" data-action="toggle-complete" />
          <span class="task-name"></span>
          <button data-action="show-more">Show more...</button>
          <button data-action="delete-todo">Delete</button>
        </li>
      </template>
      <!-- -------------------------------------------------------------- -->
       <!-- Template με βάση του οποίο θα εμφανίζονται οι λεπτομέρειες του κάθε task στο UI με βάση το id. 
        Θα εισάγται στο <section class="main-container"> πάνω από όλα. Όπως και με τις φόρμες συμπλήρωσης στοιχείων-->
      <template id="task-details">
        <div class="detail-card">
          <h2 class="detail-task-name"></h2>
          <span class="description"></span>
          <span class="notes"></span>
          <span class="creation-date"></span>
          <span class="expire-date"></span>
          <span class="priority"></span>
          <button data-action="delete-todo">Delete</button>
        </div>
      </template>
      <!-- -------------------------------------------------------------- -->
    </main>
  </body>
</html>
